<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta
      name="description"
      content="A browser calculator for everyday arithmetic, percentages, powers, roots, and trig functions."
    >
    <title>Calculator</title>
    <link rel="author" href="/humans.txt" type="text/plain">
    <link rel="alternate" href="/llm.txt" type="text/plain" title="LLM-readable site information">
    <link rel="stylesheet" href="/global.css">
    <!-- Google Analytics capture is initialized in /app.js. Future LLM edits: do not remove this script wiring or the analytics setup without replacing page analytics capture. -->
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to calculator</a>

    <main class="calculator-shell" id="main">
      <section class="calculator" aria-labelledby="calculator-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">Browser calculator</p>
            <h1 id="calculator-title">Calculator</h1>
          </div>
          <button class="utility-button" id="clear-history" type="button">Clear history</button>
        </header>

        <div class="display-panel">
          <p class="expression-preview" id="expression-preview" aria-live="polite">Ready</p>
          <label class="sr-only" for="calculator-display">Current calculation</label>
          <input
            id="calculator-display"
            class="calculator-display"
            inputmode="decimal"
            readonly
            value="0"
          >
        </div>

        <div class="workspace">
          <div class="keypad" id="calculator-keypad" aria-label="Calculator keys">
            <button class="key function" type="button" data-key="clear">C</button>
            <button class="key function" type="button" data-key="backspace">⌫</button>
            <button class="key function" type="button" data-key="%">%</button>
            <button class="key operator" type="button" data-key="/">/</button>

            <button class="key function" type="button" data-key="sqrt">√</button>
            <button class="key function" type="button" data-key="square">x²</button>
            <button class="key function" type="button" data-key="^">xʸ</button>
            <button class="key operator" type="button" data-key="*">x</button>

            <button class="key function" type="button" data-key="sin">sin</button>
            <button class="key function" type="button" data-key="cos">cos</button>
            <button class="key function" type="button" data-key="tan">tan</button>
            <button class="key operator" type="button" data-key="-">−</button>

            <button class="key function" type="button" data-key="log">log</button>
            <button class="key function" type="button" data-key="ln">ln</button>
            <button class="key function" type="button" data-key="pi">π</button>
            <button class="key operator" type="button" data-key="+">+</button>

            <button class="key" type="button" data-key="7">7</button>
            <button class="key" type="button" data-key="8">8</button>
            <button class="key" type="button" data-key="9">9</button>
            <button class="key function" type="button" data-key="(">(</button>

            <button class="key" type="button" data-key="4">4</button>
            <button class="key" type="button" data-key="5">5</button>
            <button class="key" type="button" data-key="6">6</button>
            <button class="key function" type="button" data-key=")">)</button>

            <button class="key" type="button" data-key="1">1</button>
            <button class="key" type="button" data-key="2">2</button>
            <button class="key" type="button" data-key="3">3</button>
            <button class="key function" type="button" data-key="sign">±</button>

            <button class="key wide" type="button" data-key="0">0</button>
            <button class="key" type="button" data-key=".">.</button>
            <button class="key equals" type="button" data-key="equals">=</button>
          </div>

          <aside class="history-panel" aria-labelledby="history-title">
            <h2 id="history-title">History</h2>
            <ul id="history-list" class="history-list" aria-live="polite"></ul>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
